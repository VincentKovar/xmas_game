<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luden Lens: Rebel Interface</title>
    <style>
        body { margin: 0; overflow: hidden; background: #002200; font-family: 'Courier New', monospace; color: #00ff00; }
        
        /* The "Corporate" World */
        #video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) brightness(0.5); }
        
        /* The Rebel Lens Frame */
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            border: 20px solid #111; box-sizing: border-box;
            background: radial-gradient(circle, transparent 30%, rgba(0,20,0,0.9) 70%);
            pointer-events: none;
        }

        /* The Circular Viewport */
        #lens-circle {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw; height: 80vw;
            border: 2px solid #00ff00; border-radius: 50%;
            box-shadow: 0 0 15px #00ff00;
        }

        /* Scanline */
        #scanline {
            position: absolute; width: 100%; height: 4px;
            background: rgba(0, 255, 0, 0.3);
            box-shadow: 0 0 10px #00ff00;
            animation: moveScan 4s linear infinite;
        }

        @keyframes moveScan { from { top: 10%; } to { top: 90%; } }

        #data-readout { position: absolute; bottom: 120px; width: 100%; text-align: center; font-size: 12px; }
        
        button {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: #ff00ff; color: white; border: none; padding: 15px 30px;
            font-weight: bold; font-family: 'Courier New'; cursor: pointer;
            box-shadow: 0 0 10px #ff00ff; border-radius: 5px; display: none;
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <div id="ui-overlay">
        <div id="lens-circle"><div id="scanline"></div></div>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
    
    <div id="data-readout">SEARCHING FOR CMI FREQUENCIES...</div>
    <button id="capture-btn" onclick="captureTruth()">CAPTURE TRUTH</button>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const readout = document.getElementById('data-readout');
        const captureBtn = document.getElementById('capture-btn');

        // Audio System (Euterpe's Hum)
        let audioCtx, oscillator, gainNode;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                oscillator = audioCtx.createOscillator();
                gainNode = audioCtx.createGain();
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(55, audioCtx.currentTime); // Low frequency
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
            }
        }

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            video.play();
        }

        function analyze() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = 100; // Low res for speed
                canvas.height = 100;
                ctx.drawImage(video, 0, 0, 100, 100);
                const data = ctx.getImageData(0, 0, 100, 100).data;
                
                let redCount = 0;
                for (let i = 0; i < data.length; i += 4) {
                    if (data[i] > 150 && data[i+1] < 100 && data[i+2] < 100) redCount++;
                }

                // Threshold logic (Stop sign detection)
                if (redCount > 600) { 
                    initAudio();
                    readout.innerHTML = "<span style='color:#ff00ff'>VIBRATION DETECTED: PAVIDIA SIGNAL DETECTED</span>";
                    gainNode.gain.setTargetAtTime(0.2, audioCtx.currentTime, 0.1);
                    oscillator.frequency.setTargetAtTime(110, audioCtx.currentTime, 0.1);
                    captureBtn.style.display = "block";
                } else {
                    if (gainNode) gainNode.gain.setTargetAtTime(0.01, audioCtx.currentTime, 0.1);
                    readout.innerText = "SCANNING ENVIRONMENT FOR ANCHORS...";
                    captureBtn.style.display = "none";
                }
            }
            requestAnimationFrame(analyze);
        }

        function captureTruth() {
            // In a real ARG, you'd send this to a server. 
            // Here, we simulate the "Decryption"
            alert("TRUTH EXTRACTED: Play On 5555\n\nSubmit this code to the Ludus Archive.");
        }

        // Start on interaction
        document.body.addEventListener('click', () => {
            startCamera();
            initAudio();
            analyze();
        }, { once: true });
    </script>
</body>
</html>
