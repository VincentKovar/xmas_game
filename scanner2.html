<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luden Lens: REBEL RECOVERY</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: #00ff00; }
        #video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) brightness(0.4); }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; border: 15px solid #111; box-sizing: border-box; background: radial-gradient(circle, transparent 40%, rgba(0,30,0,0.8) 90%); }
        #lens-circle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70vw; height: 70vw; border: 1px solid #00ff00; border-radius: 50%; box-shadow: 0 0 20px #00ff00; }
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; padding: 20px; box-sizing: border-box; }
        #data-readout { position: absolute; bottom: 100px; width: 100%; text-align: center; text-shadow: 0 0 5px #0f0; }
        button { background: #00ff00; color: #000; border: none; padding: 20px 40px; font-weight: bold; font-family: 'Courier New'; cursor: pointer; font-size: 1.2rem; }
        #capture-btn { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #ff00ff; color: #fff; display: none; pointer-events: auto; }
    </style>
</head>
<body>

    <div id="splash">
        <h1>UNAUTHORIZED ACCESS</h1>
        <p>CMI ENCRYPTION DETECTED</p>
        <button onclick="initRebelTool()">BOOT LUDEN_LENS.exe</button>
    </div>

    <video id="video" autoplay playsinline muted></video>
    
    <div id="overlay">
        <div id="lens-circle"></div>
    </div>

    <div id="data-readout">SYSTEM OFFLINE</div>
    <button id="capture-btn" onclick="captureTruth()">EXTRACT TRUTH</button>
    <canvas id="procCanvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const readout = document.getElementById('data-readout');
        const captureBtn = document.getElementById('capture-btn');
        const procCanvas = document.getElementById('procCanvas');
        const pCtx = procCanvas.getContext('2d', {willReadFrequently: true});

        let audioCtx, osc, gain;

        async function initRebelTool() {
            // 1. Remove Splash
            document.getElementById('splash').style.display = 'none';

            // 2. Init Audio (Must be inside click handler)
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            osc = audioCtx.createOscillator();
            gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(60, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();

            // 3. Init Camera
            const constraints = {
                video: { facingMode: { exact: "environment" } }, // Force back camera
                audio: false
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                readout.innerText = "LENS ACTIVE: SCANNING...";
                requestAnimationFrame(analyzeFrame);
            } catch (err) {
                // Fallback for desktop or if "exact environment" fails
                const easyStream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = easyStream;
                readout.innerText = "LENS ACTIVE (FALLBACK MODE)";
                requestAnimationFrame(analyzeFrame);
            }
        }

        function analyzeFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                procCanvas.width = 100;
                procCanvas.height = 100;
                pCtx.drawImage(video, 0, 0, 100, 100);
                const pixels = pCtx.getImageData(0, 0, 100, 100).data;

                let reds = 0;
                for (let i = 0; i < pixels.length; i += 4) {
                    // Look for pure red
                    if (pixels[i] > 140 && pixels[i+1] < 100 && pixels[i+2] < 100) reds++;
                }

                if (reds > 500) { // Found a red mass
                    readout.innerHTML = "<span style='color:#ff00ff'>SIGNATURE MATCH: 5555_FREQ</span>";
                    gain.gain.setTargetAtTime(0.3, audioCtx.currentTime, 0.1);
                    osc.frequency.setTargetAtTime(220, audioCtx.currentTime, 0.1);
                    captureBtn.style.display = "block";
                } else {
                    readout.innerHTML = "SCANNING FOR CORPORATE ANCHORS...";
                    gain.gain.setTargetAtTime(0.05, audioCtx.currentTime, 0.1);
                    osc.frequency.setTargetAtTime(60, audioCtx.currentTime, 0.1);
                    captureBtn.style.display = "none";
                }
            }
            requestAnimationFrame(analyzeFrame);
        }

        function captureTruth() {
            alert("DECRYPTED MESSAGE: Play On 5555");
        }
    </script>
</body>
</html>
