<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotería Dialer</title>
    <style>
        :root {
            --mexican-pink: #E4007C;
            --mexican-blue: #00A1E4;
            --card-yellow: #FFF9C4;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 5px solid var(--mexican-pink);
        }

        h1 { color: var(--mexican-pink); margin-bottom: 0.5rem; }
        
        #card-display {
            width: 250px;
            height: 380px;
            background-color: var(--card-yellow);
            border: 8px solid #333;
            border-radius: 10px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            position: relative;
            transition: transform 0.3s ease;
        }

        #card-image {
            width: 100%;
            height: 70%;
            background-color: #ddd;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
        }

        #card-name {
            font-size: 1.8rem;
            font-weight: bold;
            color: #333;
            text-transform: uppercase;
            margin-top: 10px;
        }

        #card-number {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: opacity 0.2s;
        }

        #draw-btn { background-color: var(--mexican-blue); color: white; }
        #reset-btn { background-color: #777; color: white; }
        button:hover { opacity: 0.8; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        #stats { margin-top: 15px; color: #666; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lotería!</h1>
        <div id="stats">Cards left: <span id="count">54</span></div>

        <div id="card-display">
            <div id="card-number">--</div>
            <div id="card-image">🇲🇽</div>
            <div id="card-name">Ready?</div>
        </div>

        <div class="controls">
            <button id="draw-btn">¡Corre y se va!</button>
            <button id="reset-btn">Reset</button>
        </div>
    </div>

    <script>
        const cards = [
            "El Gallo", "El Diablito", "La Dama", "El Catrín", "El Paraguas", "La Sirena", 
            "La Escalera", "La Botella", "El Barril", "El Árbol", "El Melón", "El Valiente", 
            "El Gorrito", "La Muerte", "La Pera", "La Bandera", "El Bandolón", "El Violoncello", 
            "La Garza", "El Pájaro", "La Mano", "La Bota", "La Luna", "El Cotorro", 
            "El Borracho", "El Negrito", "El Corazón", "La Sandía", "El Tambor", "El Camarón", 
            "Las Jaras", "El Músico", "La Araña", "La Canoa", "El Pino", "El Pescado", 
            "La Palma", "La Maceta", "El Arpa", "La Rana", "La Rosa", "La Calavera", 
            "La Campana", "El Cantarito", "El Venado", "El Sol", "La Corona", "La Chalupa", 
            "El Pinocho", "El Pescado", "La Palma", "La Maceta", "El Arpa", "La Rana"
        ].map((name, index) => ({ id: index + 1, name }));

        let deck = [...cards];
        let history = [];

        const drawBtn = document.getElementById('draw-btn');
        const resetBtn = document.getElementById('reset-btn');
        const nameEl = document.getElementById('card-name');
        const numEl = document.getElementById('card-number');
        const countEl = document.getElementById('count');
        const imageEl = document.getElementById('card-image');

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function drawCard() {
            if (deck.length === 0) {
                nameEl.textContent = "¡FIN DEL JUEGO!";
                drawBtn.disabled = true;
                return;
            }

            const card = deck.pop();
            history.push(card);
            
            // Update UI
            numEl.textContent = card.id;
            nameEl.textContent = card.name;
            countEl.textContent = deck.length;
            
            // Visual flair
            document.getElementById('card-display').style.transform = "scale(1.05)";
            setTimeout(() => {
                document.getElementById('card-display').style.transform = "scale(1)";
            }, 100);
        }

        function resetGame() {
            deck = [...cards];
            shuffle(deck);
            history = [];
            nameEl.textContent = "Ready?";
            numEl.textContent = "--";
            countEl.textContent = "54";
            drawBtn.disabled = false;
        }

        drawBtn.addEventListener('click', drawCard);
        resetBtn.addEventListener('click', resetGame);

        // Initial Shuffle
        shuffle(deck);
    </script>
</body>
</html>
